<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="indigoGlow" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="75%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Tag Gradient -->
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="140" r="280" fill="url(#indigoGlow)" />
  <circle cx="920" cy="260" r="320" fill="url(#cyanGlow)" />
  <circle cx="600" cy="380" r="240" fill="url(#emeraldGlow)" />

  <!-- Outer Glass Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- TOP BADGE PILL -->
  <g transform="translate(600, 60)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
    <circle cx="-142" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-128" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">PRODUCTION-READY v1.0 • ZERO RUNTIME DEPS</text>
  </g>

  <!-- LOGO ICON + MAIN TITLE -->
  <g transform="translate(600, 160)">
    <!-- Bolt Icon Container -->
    <g transform="translate(-250, -42)">
      <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#proGrad)" />
      <!-- Lightning Bolt SVG Path -->
      <path d="M 44 14 L 24 44 L 40 44 L 36 68 L 56 36 L 40 36 Z" fill="#ffffff">
        <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- Title Text -->
    <text x="-145" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="64" font-weight="800" fill="url(#brandGrad)" letter-spacing="-1.5">
      RentPulse
    </text>

    <!-- PRO Tag Badge -->
    <g transform="translate(190, -28)">
      <rect x="0" y="0" width="84" height="46" rx="12" fill="url(#proGrad)" />
      <text x="42" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="1">PRO</text>
    </g>
  </g>

  <!-- SUBTITLE -->
  <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="-0.2">
    Single-Room Rent &amp; Electricity Sub-Meter Management System
  </text>
  <text x="600" y="265" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#64748b" letter-spacing="0.2">
    Vanilla HTML5 / CSS3 / ES2022 • Google Sheets Cloud Database • WhatsApp 1-Tap UPI • Automated Drive Invoices
  </text>

  <!-- 3 BOTTOM PILL CARDS -->
  <g transform="translate(600, 340)">
    <!-- Card 1: Dial Photos -->
    <g transform="translate(-360, 0)">
      <rect x="-140" y="-24" width="280" height="48" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
      <circle cx="-105" cy="0" r="14" fill="rgba(99, 102, 241, 0.2)" />
      <text x="-105" y="5" text-anchor="middle" font-size="14">📸</text>
      <text x="-80" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Sub-Meter Photo Proofs</text>
    </g>

    <!-- Card 2: Cloud Sync -->
    <g transform="translate(0, 0)">
      <rect x="-140" y="-24" width="280" height="48" rx="24" fill="url(#cardGrad)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
      <circle cx="-105" cy="0" r="14" fill="rgba(6, 182, 212, 0.2)" />
      <text x="-105" y="5" text-anchor="middle" font-size="14">🔄</text>
      <text x="-80" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Google Sheets Cloud Sync</text>
    </g>

    <!-- Card 3: Salted Auth -->
    <g transform="translate(360, 0)">
      <rect x="-140" y="-24" width="280" height="48" rx="24" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <circle cx="-105" cy="0" r="14" fill="rgba(16, 185, 129, 0.2)" />
      <text x="-105" y="5" text-anchor="middle" font-size="14">🛡️</text>
      <text x="-80" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Zero-Secret Salted Auth</text>
    </g>
  </g>
</svg>
