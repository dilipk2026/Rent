<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829" />
      <stop offset="100%" stop-color="#0f1422" />
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="480" rx="16" fill="#090d16" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="42" rx="16" fill="#0f1523" />
  <rect x="0" y="26" width="800" height="16" fill="#0f1523" />
  <circle cx="24" cy="21" r="6" fill="#f43f5e" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <text x="400" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#64748b">Bill Generator &amp; Meter Photo Engine</text>

  <!-- Main Card Body -->
  <g transform="translate(30, 62)">
    <!-- Left Column: Inputs & Calculations -->
    <g transform="translate(0, 0)">
      <rect width="450" height="388" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      
      <!-- Room Title Tag -->
      <rect x="24" y="20" width="180" height="26" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1" />
      <text x="36" y="37" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#a5b4fc">ROOM 1 (GROUND FLOOR)</text>

      <!-- Readings Row -->
      <g transform="translate(24, 62)">
        <!-- Previous -->
        <rect width="190" height="64" rx="8" fill="#171f33" stroke="rgba(255,255,255,0.06)" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">PREVIOUS READING</text>
        <text x="14" y="50" font-family="'Space Grotesk', monospace, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">1265.0 <tspan font-size="12" fill="#64748b">kWh</tspan></text>

        <!-- Current -->
        <g transform="translate(210, 0)">
          <rect width="190" height="64" rx="8" fill="#1a243b" stroke="#6366f1" stroke-width="1.5" />
          <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">CURRENT READING</text>
          <text x="14" y="50" font-family="'Space Grotesk', monospace, sans-serif" font-size="20" font-weight="700" fill="#38bdf8">1345.5 <tspan font-size="12" fill="#38bdf8">kWh</tspan></text>
        </g>
      </g>

      <!-- Breakdown Table -->
      <g transform="translate(24, 146)">
        <rect width="400" height="136" rx="8" fill="#141c2e" />
        <text x="16" y="28" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Units Consumed (1345.5 - 1265.0)</text>
        <text x="384" y="28" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#f59e0b">80.5 kWh</text>

        <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Electricity Amount (80.5 × ₹8.00)</text>
        <text x="384" y="58" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">₹644.00</text>

        <text x="16" y="88" font-family="-apple-system, sans-serif" font-size="13" fill="#94a3b8">Fixed Monthly Room Rent</text>
        <text x="384" y="88" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">₹5,000.00</text>

        <line x1="16" y1="102" x2="384" y2="102" stroke="rgba(255,255,255,0.1)" stroke-dasharray="3,3" />

        <text x="16" y="124" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">TOTAL STATEMENT AMOUNT</text>
        <text x="384" y="124" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#10b981">₹5,644.00</text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(24, 302)">
        <!-- WhatsApp Button -->
        <rect width="190" height="42" rx="8" fill="url(#btnGrad)" />
        <text x="95" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">📲 WhatsApp Bill</text>

        <!-- Save Button -->
        <g transform="translate(210, 0)">
          <rect width="190" height="42" rx="8" fill="url(#primaryGrad)" />
          <text x="95" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">💾 Save &amp; Cloud Sync</text>
        </g>
      </g>

      <text x="24" y="366" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">Auto-syncs to Google Sheets &amp; generates Google Drive PDF invoice.</text>
    </g>

    <!-- Right Column: Dial Photo & QR Code -->
    <g transform="translate(470, 0)">
      <rect width="270" height="388" rx="12" fill="url(#cardBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      
      <!-- Sub-Meter Dial Box -->
      <text x="20" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">VERIFIABLE PHOTO PROOF</text>
      <rect x="20" y="42" width="230" height="135" rx="8" fill="#151d30" stroke="#38bdf8" stroke-dasharray="4,4" />
      
      <!-- Camera Icon & Label -->
      <circle cx="135" cy="95" r="22" fill="rgba(56,189,248,0.15)" />
      <text x="135" y="101" text-anchor="middle" font-size="18">⚡</text>
      <text x="135" y="132" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Dial Photo Attached</text>
      <text x="135" y="148" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#64748b">Downsampled &lt;600px • 42 KB</text>

      <!-- Dynamic UPI QR -->
      <text x="20" y="206" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">DYNAMIC UPI QR CODE</text>
      <rect x="20" y="218" width="230" height="150" rx="8" fill="#ffffff" />
      
      <!-- QR Pattern Placeholder Shapes -->
      <g transform="translate(65, 230)">
        <rect width="140" height="125" fill="none" />
        <rect x="10" y="5" width="30" height="30" fill="#0f172a" />
        <rect x="15" y="10" width="20" height="20" fill="#ffffff" />
        <rect x="19" y="14" width="12" height="12" fill="#0f172a" />

        <rect x="90" y="5" width="30" height="30" fill="#0f172a" />
        <rect x="95" y="10" width="20" height="20" fill="#ffffff" />
        <rect x="99" y="14" width="12" height="12" fill="#0f172a" />

        <rect x="10" y="80" width="30" height="30" fill="#0f172a" />
        <rect x="15" y="85" width="20" height="20" fill="#ffffff" />
        <rect x="19" y="89" width="12" height="12" fill="#0f172a" />

        <circle cx="65" cy="58" r="8" fill="#6366f1" />
        <text x="65" y="62" text-anchor="middle" font-size="9" fill="#ffffff" font-weight="900">₹</text>
      </g>
      <text x="135" y="356" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Scan to Pay ₹5,644.00</text>
    </g>
  </g>
</svg>
